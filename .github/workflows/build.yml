# Builds ONE self-contained Windows executable (LimbusFight.exe) on every push to main.
# raylib.dll and the .NET 8 runtime are packed inside the exe: no zip, no DLLs, no .NET install.
#
# The exe is published to a rolling GitHub pre-release called "latest-build", replaced on every
# push. Release files do NOT use the account's 500 MB Actions artifact storage, so builds can
# never fail with "Artifact storage quota has been hit". Permanent download link:
#   https://github.com/<owner>/<repo>/releases/download/latest-build/LimbusFight.exe

name: Build LimbusFight.exe

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual "Run workflow" button in the Actions tab

permissions:
  contents: write # needed to create / replace the "latest-build" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: src/LimbusFight/LimbusFight.csproj

jobs:
  build-win-x64:
    name: Build win-x64 single-file exe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained single-file exe
        shell: pwsh
        run: >
          dotnet publish $env:PROJECT
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:Version=0.1.${{ github.run_number }}
          -p:SourceRevisionId=${{ github.sha }}

      - name: Verify output is exactly one exe
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File
          $files | Format-Table Name, @{ Label = 'Size (MB)'; Expression = { '{0:N1}' -f ($_.Length / 1MB) } } -AutoSize
          if (-not (Test-Path publish/LimbusFight.exe)) { throw 'publish/LimbusFight.exe was not produced.' }
          $leaked = $files | Where-Object { $_.Extension -in '.dll', '.so', '.dylib' }
          if ($leaked) { throw "Libraries leaked next to the exe (should be bundled inside): $($leaked.Name -join ', ')" }

      - name: Smoke test (starts exe, unpacks + loads raylib.dll, asset libraries, scans Steam)
        shell: pwsh
        run: |
          ./publish/LimbusFight.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed with exit code $LASTEXITCODE" }

      - name: Smoke test (asset scan runs; no Limbus Company on the runner, so it finds nothing)
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          Copy-Item "$env:GITHUB_WORKSPACE/publish/LimbusFight.exe" .
          ./LimbusFight.exe --scan-assets
          if ($LASTEXITCODE -ne 0) { throw "Asset scan failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path ./LimbusFight_asset_report.txt)) { throw 'Asset report was not written.' }

      - name: Publish LimbusFight.exe to the "latest-build" pre-release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: latest-build
        run: |
          $sha = "${{ github.sha }}"
          $version = "0.1.${{ github.run_number }}"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @(
            "Automatic build v$version from commit $($sha.Substring(0, 7)).",
            '',
            'Download **LimbusFight.exe** below and run it. It is an unsigned debug build, so Windows SmartScreen may warn: click *More info* > *Run anyway*.',
            '',
            'This release is replaced on every push to main.'
          ) | Set-Content -Path $notesFile -Encoding utf8

          # Replace the previous build: delete the old release and its tag (if any), then recreate both on this commit.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete the old '$env:TAG' release." }
          }

          gh release create $env:TAG publish/LimbusFight.exe `
            --target $sha `
            --prerelease `
            --title "Latest build (v$version)" `
            --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "Could not create the '$env:TAG' release." }

          $url = "https://github.com/$env:GH_REPO/releases/download/$env:TAG/LimbusFight.exe"
          "Download: $url"
          "### LimbusFight.exe v$version`n`n[Download LimbusFight.exe]($url)" >> $env:GITHUB_STEP_SUMMARY
